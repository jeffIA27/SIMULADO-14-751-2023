<script>
const questions=[
{n:1,cmd:"Julgue o item a seguir, a respeito das disposições gerais da Lei nº 14.751/2023.",text:"A Lei nº 14.751/2023 institui a Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares dos Estados, do Distrito Federal e dos Territórios, nos termos do inciso XXI do caput do art. 22 da Constituição Federal.",ans:"C",exp:"A Lei nº 14.751/2023 foi instituída exatamente com essa finalidade, conforme seu enunciado.",src:"Lei nº 14.751/2023, ementa."},
{n:2,cmd:"Acerca das características das instituições militares, julgue o item subsequente.",text:"As polícias militares e os corpos de bombeiros militares são instituições militares permanentes, exclusivas e típicas de Estado, na condição de forças auxiliares e reserva do Exército.",ans:"C",exp:"O art. 2º da Lei estabelece que as PMs e CBMs são instituições militares permanentes, exclusivas e típicas de Estado, essenciais à Justiça Militar, na condição de forças auxiliares e reserva do Exército.",src:"Lei nº 14.751/2023, art. 2º, caput."},
{n:3,cmd:"Com relação ao comando das instituições militares, julgue o seguinte item.",text:"As polícias militares e os corpos de bombeiros militares devem ser comandadas por oficial da reserva do último posto, integrante do Quadro de Oficiais de Estado-Maior (QOEM).",ans:"E",exp:"O art. 2º determina que as instituições são comandadas por oficial DA ATIVA do último posto, e não da reserva. A troca de 'ativa' por 'reserva' inverte o dispositivo legal.",src:"Lei nº 14.751/2023, art. 2º, caput."},
{n:4,cmd:"Julgue o item a seguir, a respeito das atribuições das polícias militares.",text:"Às polícias militares, integrantes do Sistema Único de Segurança Pública (Susp), cabe a proteção dos direitos fundamentais no âmbito da preservação da ordem pública, da polícia ostensiva e da polícia judiciária militar.",ans:"C",exp:"O § 1º do art. 2º afirma exatamente isso: às PMs cabe a proteção dos direitos fundamentais no âmbito da preservação da ordem pública, da polícia ostensiva e da polícia judiciária militar.",src:"Lei nº 14.751/2023, art. 2º, § 1º."},
{n:5,cmd:"Acerca das atribuições dos corpos de bombeiros militares, julgue o item subsequente.",text:"Aos corpos de bombeiros militares cabe exclusivamente a prevenção e o combate a incêndios, não tendo atribuições de polícia judiciária militar.",ans:"E",exp:"O § 2º do art. 2º atribui aos CBMs não apenas a prevenção e combate a incêndios, mas também a polícia judiciária militar. O termo 'exclusivamente' torna o item errado.",src:"Lei nº 14.751/2023, art. 2º, § 2º."},
{n:6,cmd:"Com relação à integração sistêmica das instituições, julgue o seguinte item.",text:"As polícias militares e os corpos de bombeiros militares são integrantes do Sistema Único de Segurança Pública (Susp), da Defesa Nacional, do Sistema Nacional de Proteção e Defesa Civil (Sinpdec) e do Sistema Nacional do Meio Ambiente (Sisnama).",ans:"C",exp:"O art. 2º, § 3º, inciso V, lista exatamente esses quatro sistemas como integrantes.",src:"Lei nº 14.751/2023, art. 2º, § 3º, V."},
{n:7,cmd:"Julgue o item a seguir, a respeito dos princípios básicos das instituições militares.",text:"São princípios básicos das polícias militares e dos corpos de bombeiros militares, entre outros: hierarquia, disciplina, legalidade, impessoalidade, moralidade e eficiência.",ans:"C",exp:"O art. 3º lista esses princípios nos incisos I (hierarquia), II (disciplina), IV (legalidade), V (impessoalidade), VII (moralidade) e VIII (eficiência).",src:"Lei nº 14.751/2023, art. 3º, I, II, IV, V, VII e VIII."},
{n:8,cmd:"Acerca dos princípios básicos, julgue o item subsequente.",text:"A proteção, promoção e respeito aos direitos humanos, inclusive os decorrentes de compromissos internacionais assumidos pelo Brasil, é um dos princípios básicos observados pelas instituições militares.",ans:"C",exp:"O art. 3º, inciso III, prevê expressamente: proteção, promoção e respeito aos direitos humanos, inclusive os decorrentes de compromissos internacionais assumidos pelo Brasil.",src:"Lei nº 14.751/2023, art. 3º, III."},
{n:9,cmd:"Com relação aos princípios, julgue o seguinte item.",text:"A universalidade na prestação do serviço e a participação e interação comunitária não estão previstas como princípios básicos na Lei nº 14.751/2023.",ans:"E",exp:"O art. 3º prevê expressamente a universalidade na prestação do serviço (inciso XI) e a participação e interação comunitária (inciso XII) como princípios básicos.",src:"Lei nº 14.751/2023, art. 3º, XI e XII."},
{n:10,cmd:"Julgue o item a seguir, a respeito das diretrizes das instituições militares.",text:"O uso racional da força e o uso progressivo dos meios são diretrizes a serem observadas pelas polícias militares e pelos corpos de bombeiros militares.",ans:"C",exp:"O art. 4º, inciso XIV, prevê expressamente 'uso racional da força e uso progressivo dos meios' como uma das diretrizes.",src:"Lei nº 14.751/2023, art. 4º, XIV."},
{n:11,cmd:"Acerca das competências das polícias militares, julgue o item subsequente.",text:"Compete às polícias militares executar, ressalvada a competência da União, a polícia de preservação da ordem pública, a polícia ostensiva e, privativamente, a polícia judiciária militar.",ans:"C",exp:"O art. 5º, inciso II, prevê que compete às PMs executar, ressalvada a competência da União, a polícia de preservação da ordem pública, a polícia ostensiva e, privativamente, a polícia judiciária militar.",src:"Lei nº 14.751/2023, art. 5º, II."},
{n:12,cmd:"Com relação à polícia ostensiva rodoviária, julgue o seguinte item.",text:"As polícias militares não podem exercer a polícia ostensiva rodoviária e de trânsito, pois essa competência é exclusiva dos órgãos municipais de trânsito.",ans:"E",exp:"O art. 5º, inciso V, prevê que compete às PMs exercer a polícia ostensiva rodoviária e de trânsito no âmbito dos Estados, como integrantes do Sistema Nacional de Trânsito.",src:"Lei nº 14.751/2023, art. 5º, V."},
{n:13,cmd:"Julgue o item a seguir, a respeito da proteção ambiental pelas polícias militares.",text:"As polícias militares podem lavrar auto de infração ambiental e aplicar as sanções e penalidades administrativas, como integrante do Sisnama.",ans:"C",exp:"O art. 5º, inciso VII, alíneas 'b' e 'c', prevê que compete às PMs lavrar auto de infração ambiental e aplicar as sanções e penalidades administrativas.",src:"Lei nº 14.751/2023, art. 5º, VII, 'b' e 'c'."},
{n:14,cmd:"Acerca da polícia judiciária militar, julgue o item subsequente.",text:"As funções constitucionais das polícias militares podem ser exercidas por civis contratados mediante convênio, desde que autorizado em lei.",ans:"E",exp:"O art. 5º, § 3º, estabelece que as funções constitucionais das PMs somente serão exercidas pelos militares que as integram, admitida apenas a celebração de convênio e acordos de cooperação técnica.",src:"Lei nº 14.751/2023, art. 5º, § 3º."},
{n:15,cmd:"Com relação à custódia de militares presos, julgue o seguinte item.",text:"Compete às polícias militares custodiar, na forma da lei, por meio de órgão próprio ou, na ausência deste, em unidade militar, o militar condenado ou preso provisoriamente, à disposição da autoridade competente.",ans:"C",exp:"O art. 5º, inciso XVII, prevê expressamente essa competência de custodiar o militar condenado ou preso provisoriamente.",src:"Lei nº 14.751/2023, art. 5º, XVII."},
{n:16,cmd:"Julgue o item a seguir, a respeito das competências dos corpos de bombeiros militares.",text:"Aos corpos de bombeiros militares compete executar, prioritariamente, as ações de busca, salvamento e resgate e, privativamente, as ações de prevenção, combate e perícia administrativa de incêndios e de polícia judiciária militar.",ans:"C",exp:"O art. 6º, inciso II, estabelece essa competência: executar prioritariamente as ações de busca, salvamento e resgate e, privativamente, as ações de prevenção, combate e perícia administrativa de incêndios e de polícia judiciária militar.",src:"Lei nº 14.751/2023, art. 6º, II."},
{n:17,cmd:"Acerca da segurança contra incêndio, julgue o item subsequente.",text:"Os corpos de bombeiros militares exercem, privativamente, a segurança contra incêndio, pânico e emergência.",ans:"C",exp:"O art. 6º, inciso IX, prevê que compete aos CBMs privativamente exercer a segurança contra incêndio, pânico e emergência.",src:"Lei nº 14.751/2023, art. 6º, IX."},
{n:18,cmd:"Com relação à perícia administrativa dos bombeiros, julgue o seguinte item.",text:"A perícia administrativa dos corpos de bombeiros militares será feita antes da liberação do local pelo perito criminal, sendo vedada a realização sem a presença da perícia criminal.",ans:"E",exp:"O art. 6º, § 5º, estabelece que a perícia administrativa será feita DEPOIS de liberado o local pelo perito criminal, salvo manifesta impossibilidade de presença. A questão inverteu a ordem.",src:"Lei nº 14.751/2023, art. 6º, § 5º."},
{n:19,cmd:"Julgue o item a seguir, a respeito da subordinação das instituições militares.",text:"As polícias militares e os corpos de bombeiros militares subordinam-se aos governadores dos Estados, do Distrito Federal e dos Territórios.",ans:"C",exp:"O art. 7º, caput, prevê: as PMs e CBMs subordinam-se aos governadores dos Estados, do Distrito Federal e dos Territórios.",src:"Lei nº 14.751/2023, art. 7º, caput."},
{n:20,cmd:"Acerca da cooperação entre instituições, julgue o item subsequente.",text:"É vedada a cooperação das polícias militares para formação e treinamento de natureza militar para as instituições civis.",ans:"C",exp:"O art. 8º, parágrafo único, estabelece expressamente: é vedada a cooperação para formação e treinamento de natureza militar para as instituições civis.",src:"Lei nº 14.751/2023, art. 8º, parágrafo único."},
{n:21,cmd:"Com relação à organização das instituições, julgue o seguinte item.",text:"A organização das polícias militares e dos corpos de bombeiros militares será fixada em lei de iniciativa privativa do governador, observados as normas gerais previstas na Lei nº 14.751/2023 e os fundamentos de organização das Forças Armadas.",ans:"C",exp:"O art. 9º, caput, prevê que a organização será fixada em lei de iniciativa privativa do governador, observadas as normas gerais e os fundamentos das Forças Armadas.",src:"Lei nº 14.751/2023, art. 9º, caput."},
{n:22,cmd:"Julgue o item a seguir, a respeito da estrutura básica das instituições.",text:"A estrutura básica das polícias militares e dos corpos de bombeiros militares deve observar, preferencialmente, órgãos de direção, assessoramento, apoio, execução e correição.",ans:"C",exp:"O art. 10, caput, lista exatamente esses cinco tipos de órgãos: direção, assessoramento, apoio, execução e correição.",src:"Lei nº 14.751/2023, art. 10, caput, I a V."},
{n:23,cmd:"Acerca dos órgãos de correição, julgue o item subsequente.",text:"Os órgãos de correição, com atuação desconcentrada, destinam-se a exercer as funções de corregedoria-geral, para a prevenção, fiscalização e apuração dos desvios de conduta em atos disciplinares e penais militares.",ans:"C",exp:"O art. 10, § 5º, prevê que os órgãos de correição destinam-se a exercer as funções de corregedoria-geral, para a prevenção, fiscalização e apuração dos desvios de conduta.",src:"Lei nº 14.751/2023, art. 10, § 5º."},
{n:24,cmd:"Com relação aos efetivos das instituições, julgue o seguinte item.",text:"Os efetivos das polícias militares e dos corpos de bombeiros militares são fixados exclusivamente com base na extensão da área territorial e na população da unidade federada.",ans:"E",exp:"O art. 11 estabelece que os efetivos são fixados considerando também índices de criminalidade, riscos potenciais de desastres, índice de desenvolvimento humano e condições socioeconômicas. O termo 'exclusivamente' ignora os demais critérios.",src:"Lei nº 14.751/2023, art. 11."},
{n:25,cmd:"Julgue o item a seguir, a respeito da hierarquia militar.",text:"A hierarquia militar nas polícias militares e nos corpos de bombeiros militares observa, entre outras, a estrutura de oficiais (superiores, intermediários e subalternos), praças especiais e praças.",ans:"C",exp:"O art. 12 estabelece a estrutura básica hierárquica em: I - oficiais; II - praças especiais; III - praças.",src:"Lei nº 14.751/2023, art. 12."},
{n:26,cmd:"Acerca dos postos de oficiais, julgue o item subsequente.",text:"Na estrutura hierárquica militar, o posto de capitão é classificado como oficial superior.",ans:"E",exp:"O art. 12, I, alínea 'b', classifica o capitão como oficial INTERMEDIÁRIO, e não como oficial superior. Os oficiais superiores são coronel, tenente-coronel e major.",src:"Lei nº 14.751/2023, art. 12, I, 'a' e 'b'."},
{n:27,cmd:"Com relação às praças, julgue o seguinte item.",text:"Na estrutura hierárquica, as praças incluem, entre outras, as graduações de subtenente, primeiro-sargento, segundo-sargento, terceiro-sargento, cabo e soldado.",ans:"C",exp:"O art. 12, III, lista: subtenente, primeiro-sargento, segundo-sargento, terceiro-sargento, cabo e soldado, entre outras graduações.",src:"Lei nº 14.751/2023, art. 12, III."},
{n:28,cmd:"Julgue o item a seguir, a respeito da designação dos postos e graduações.",text:"A todos os postos e graduações será acrescida a designação 'PM' ou 'BM', conforme a respectiva instituição.",ans:"C",exp:"O art. 12, parágrafo único, prevê: a todos os postos e graduações será acrescida a designação 'PM' ou 'BM'.",src:"Lei nº 14.751/2023, art. 12, parágrafo único."},
{n:29,cmd:"Acerca das condições para ingresso nas instituições militares, julgue o item subsequente.",text:"São condições básicas para ingresso nas polícias militares e nos corpos de bombeiros militares: ser brasileiro, estar quite com as obrigações militares e eleitorais, e ser aprovado em concurso público de provas ou de provas e títulos.",ans:"C",exp:"O art. 13 prevê essas condições nos incisos I (ser brasileiro), II (estar quite com as obrigações) e V (ser aprovado em concurso público).",src:"Lei nº 14.751/2023, art. 13, I, II e V."},
{n:30,cmd:"Com relação às condições de ingresso, julgue o seguinte item.",text:"É condição básica para ingresso nas instituições militares não possuir qualquer tipo de tatuagem visível, independentemente do conteúdo.",ans:"E",exp:"O art. 13, inciso X, veda apenas tatuagens de suásticas, obscenidades, ideologias terroristas ou que façam apologia à violência, drogas ilícitas ou discriminação. Não é vedada qualquer tatuagem.",src:"Lei nº 14.751/2023, art. 13, X."},
{n:31,cmd:"Julgue o item a seguir, a respeito do ingresso nas instituições militares.",text:"É condição básica para ingresso ser aprovado em exame de saúde e exame toxicológico com larga janela de detecção.",ans:"C",exp:"O art. 13, inciso VIII, prevê: ser aprovado em exame de saúde e exame toxicológico com larga janela de detecção.",src:"Lei nº 14.751/2023, art. 13, VIII."},
{n:32,cmd:"Acerca da escolaridade para ingresso, julgue o item subsequente.",text:"Para ingresso nas instituições militares, é exigido comprovar, na data de admissão, o grau de escolaridade superior.",ans:"C",exp:"O art. 13, inciso IX, prevê: comprovar, na data de admissão, o grau de escolaridade superior.",src:"Lei nº 14.751/2023, art. 13, IX."},
{n:33,cmd:"Com relação à progressão na hierarquia militar, julgue o seguinte item.",text:"A progressão do militar na hierarquia será fundamentada no valor moral e profissional, de forma seletiva, gradual e sucessiva, mediante promoções pelos critérios de antiguidade e merecimento.",ans:"C",exp:"O art. 14, caput, prevê que a progressão será fundamentada no valor moral e profissional, de forma seletiva, gradual e sucessiva, mediante promoções pelos critérios de antiguidade e merecimento.",src:"Lei nº 14.751/2023, art. 14, caput."},
{n:34,cmd:"Julgue o item a seguir, a respeito das promoções militares.",text:"Além dos critérios de antiguidade e merecimento, são admitidas as promoções por bravura e post mortem.",ans:"C",exp:"O art. 14, parágrafo único, prevê: serão admitidas as promoções por bravura e post mortem.",src:"Lei nº 14.751/2023, art. 14, parágrafo único."},
{n:35,cmd:"Acerca dos quadros das instituições militares, julgue o item subsequente.",text:"O Quadro de Oficiais de Estado-Maior (QOEM) é destinado ao exercício de funções de comando, chefia, direção e administração superior, sendo exigido bacharelado em direito para seus integrantes.",ans:"C",exp:"O art. 15, inciso I, prevê que o QOEM é destinado ao exercício de funções de comando, chefia, direção e administração superior, exigido bacharelado em direito.",src:"Lei nº 14.751/2023, art. 15, I."},
{n:36,cmd:"Com relação ao Quadro de Oficiais Especialistas (QOE), julgue o seguinte item.",text:"O QOE é integrado por oficiais oriundos do quadro de praças e admite promoção até o posto de coronel.",ans:"E",exp:"O art. 15, inciso II, prevê que o QOE admite promoção até o posto de TENENTE-CORONEL, e não coronel.",src:"Lei nº 14.751/2023, art. 15, II."},
{n:37,cmd:"Julgue o item a seguir, a respeito do Quadro de Oficiais de Saúde (QOS).",text:"O QOS é destinado ao desempenho de atividades de saúde, com emprego obrigatório e exclusivo na área de saúde das corporações.",ans:"C",exp:"O art. 15, inciso III, prevê que o QOS é destinado ao desempenho de atividades de saúde com emprego obrigatório e exclusivo na área de saúde das corporações.",src:"Lei nº 14.751/2023, art. 15, III."},
{n:38,cmd:"Acerca do Quadro de Praças (QP), julgue o item subsequente.",text:"O QP é integrado por praças aprovadas em concurso público de nível de escolaridade superior, com progressão até a graduação de subtenente.",ans:"C",exp:"O art. 15, inciso V, prevê que o QP é integrado por praças aprovadas em concurso público de nível de escolaridade superior, com progressão até a graduação de subtenente.",src:"Lei nº 14.751/2023, art. 15, V."},
{n:39,cmd:"Com relação ao sistema de ensino militar, julgue o seguinte item.",text:"As polícias militares e os corpos de bombeiros militares manterão o seu sistema de ensino militar, podendo incluir colégios militares de ensino fundamental e médio.",ans:"C",exp:"O art. 16, caput, prevê: as PMs e CBMs manterão o seu sistema de ensino militar, podendo incluir os colégios militares de ensino fundamental e médio.",src:"Lei nº 14.751/2023, art. 16, caput."},
{n:40,cmd:"Julgue o item a seguir, a respeito dos cursos militares.",text:"O curso de formação de oficiais (CFO) é destinado aos aprovados no concurso público para o QOEM, com ingresso na condição de cadete e habilitação à promoção a aspirante a oficial.",ans:"C",exp:"O art. 16, § 2º, I, alínea 'a', prevê: CFO destinado aos aprovados no concurso público para o QOEM, com ingresso na condição de cadete e habilitação à promoção a aspirante a oficial.",src:"Lei nº 14.751/2023, art. 16, § 2º, I, 'a'."},
{n:41,cmd:"Acerca dos cursos para praças, julgue o item subsequente.",text:"O curso de formação de sargentos (CFS) tem ingresso na graduação de aluno-sargento e habilitação à promoção à graduação de terceiro-sargento.",ans:"C",exp:"O art. 16, § 2º, II, alínea 'b', prevê: CFS com ingresso na graduação de aluno-sargento e habilitação à promoção à graduação de terceiro-sargento.",src:"Lei nº 14.751/2023, art. 16, § 2º, II, 'b'."},
{n:42,cmd:"Com relação ao curso de aperfeiçoamento de oficiais (CAO), julgue o seguinte item.",text:"O CAO é destinado aos capitães e à habilitação à promoção ao posto de major.",ans:"C",exp:"O art. 16, § 2º, I, alínea 'b', prevê: CAO destinado aos capitães e à habilitação à promoção ao posto de major.",src:"Lei nº 14.751/2023, art. 16, § 2º, I, 'b'."},
{n:43,cmd:"Julgue o item a seguir, a respeito do material de segurança pública.",text:"O material de segurança pública das instituições militares tem as mesmas prerrogativas legais de material bélico.",ans:"C",exp:"O art. 17, caput, prevê: o material de segurança pública das instituições militares tem as mesmas prerrogativas legais de material bélico.",src:"Lei nº 14.751/2023, art. 17, caput."},
{n:44,cmd:"Acerca do armamento institucional, julgue o item subsequente.",text:"As armas de fogo institucionais das polícias militares e dos corpos de bombeiros militares serão cadastradas no Sistema de Gerenciamento Militar de Armas (Sigma).",ans:"C",exp:"O art. 17, § 3º, prevê: serão cadastradas no Sistema de Gerenciamento Militar de Armas (Sigma) as armas de fogo institucionais das PMs e CBMs.",src:"Lei nº 14.751/2023, art. 17, § 3º."},
{n:45,cmd:"Com relação às garantias dos militares, julgue o seguinte item.",text:"É garantia dos militares o uso privativo dos uniformes, das insígnias e dos distintivos das respectivas instituições, vedada a utilização por qualquer entidade pública ou privada.",ans:"C",exp:"O art. 18, inciso II, prevê: uso privativo dos uniformes, das insígnias e dos distintivos, vedada a utilização por qualquer entidade pública ou privada.",src:"Lei nº 14.751/2023, art. 18, II."},
{n:46,cmd:"Julgue o item a seguir, a respeito da identidade militar.",text:"A expedição de documento de identidade militar com livre porte de arma tem fé pública em todo o território nacional, na ativa, na reserva remunerada e na reforma.",ans:"C",exp:"O art. 18, inciso IV, prevê: expedição de documento de identidade militar com livre porte de arma, com fé pública em todo o território nacional, na ativa, na reserva remunerada e na reforma.",src:"Lei nº 14.751/2023, art. 18, IV."},
{n:47,cmd:"Acerca da prisão de militares, julgue o item subsequente.",text:"O militar, antes de decisão com trânsito em julgado e enquanto não perder o posto e a patente ou a graduação, será preso em unidade prisional militar do respectivo ente e, na falta desta, em unidade militar estadual.",ans:"C",exp:"O art. 18, inciso V, prevê: prisão criminal ou civil, antes de decisão com trânsito em julgado, em unidade prisional militar do respectivo ente e, na falta desta, em unidade militar estadual.",src:"Lei nº 14.751/2023, art. 18, V."},
{n:48,cmd:"Com relação à perda do posto e da patente, julgue o seguinte item.",text:"A perda do posto e da patente, em qualquer hipótese, ocorrerá automaticamente pela condenação criminal, independentemente de decisão judicial específica.",ans:"E",exp:"O art. 18, inciso XVI, prevê que a perda do posto e da patente somente se for julgado indigno do oficialato ou com ele incompatível, por decisão do Tribunal de Justiça Militar ou do Tribunal de Justiça. Não é automática.",src:"Lei nº 14.751/2023, art. 18, XVI."},
{n:49,cmd:"Julgue o item a seguir, a respeito da estabilidade dos militares.",text:"Os militares de carreira têm estabilidade após 3 (três) anos de efetivo serviço nas corporações militares.",ans:"C",exp:"O art. 18, inciso XXVI, prevê: estabilidade dos militares de carreira após 3 (três) anos de efetivo serviço nas corporações militares.",src:"Lei nº 14.751/2023, art. 18, XXVI."},
{n:50,cmd:"Acerca da assistência aos militares, julgue o item subsequente.",text:"É garantia dos militares a assistência médica, psicológica, odontológica e social para o militar e para os seus dependentes, na forma da lei do ente federado.",ans:"C",exp:"O art. 18, inciso XIII, prevê: assistência médica, psicológica, odontológica e social para o militar e para os seus dependentes.",src:"Lei nº 14.751/2023, art. 18, XIII."},
{n:51,cmd:"Com relação às vedações aos militares, julgue o seguinte item.",text:"É vedado ao militar em atividade participar de sociedade comercial, salvo como cotista, acionista e comanditário.",ans:"C",exp:"O art. 19, inciso I, prevê: participar de sociedade comercial, salvo como cotista, acionista e comanditário.",src:"Lei nº 14.751/2023, art. 19, I."},
{n:52,cmd:"Julgue o item a seguir, a respeito das vedações.",text:"É vedado ao militar divulgar imagens de pessoas sob sua custódia sem prévia autorização judicial.",ans:"C",exp:"O art. 19, inciso VI, prevê expressamente: divulgar imagens de pessoas sob sua custódia sem prévia autorização judicial.",src:"Lei nº 14.751/2023, art. 19, VI."},
{n:53,cmd:"Acerca da elegibilidade do militar, julgue o item subsequente.",text:"O militar com menos de 10 (dez) anos de serviço que for candidato a mandato eletivo será afastado do serviço ativo no dia posterior ao pedido de registro de sua candidatura.",ans:"C",exp:"O art. 22, inciso I, prevê: o militar com menos de 10 anos de serviço será afastado do serviço ativo no dia posterior ao pedido de registro de sua candidatura.",src:"Lei nº 14.751/2023, art. 22, I."},
{n:54,cmd:"Com relação ao militar com mais de 10 anos de serviço, julgue o seguinte item.",text:"O militar com mais de 10 (dez) anos de serviço que for candidato a mandato eletivo será agregado com remuneração e, se eleito, no ato da diplomação passará para a reserva remunerada.",ans:"C",exp:"O art. 22, inciso II, prevê: será agregado com remuneração e, se eleito, no ato da diplomação passará para a reserva remunerada com remuneração proporcional ao tempo de serviço.",src:"Lei nº 14.751/2023, art. 22, II."},
{n:55,cmd:"Julgue o item a seguir, a respeito da convocação e mobilização.",text:"As polícias militares e os corpos de bombeiros militares podem ser convocados ou mobilizados pela União nos casos de decretação de intervenção federal, de estado de defesa ou de estado de sítio, precedendo o emprego das Forças Armadas.",ans:"C",exp:"O art. 24, inciso I, prevê que as instituições podem ser convocados nos casos de decretação de intervenção federal, de estado de defesa ou de estado de sítio, precedendo o emprego das Forças Armadas.",src:"Lei nº 14.751/2023, art. 24, I."},
{n:56,cmd:"Acerca da mobilização em caso de guerra, julgue o item subsequente.",text:"As polícias militares e os corpos de bombeiros militares poderão ser mobilizados pela União no caso de guerra e integrarão a força terrestre designada.",ans:"C",exp:"O art. 25, caput, prevê: poderão ser mobilizados pela União no caso de guerra e integrarão a força terrestre designada.",src:"Lei nº 14.751/2023, art. 25, caput."},
{n:57,cmd:"Com relação à IGPM/BM, julgue o seguinte item.",text:"A Inspetoria-Geral das Polícias Militares e dos Corpos de Bombeiros Militares (IGPM/BM) é integrante do Comando do Exército.",ans:"C",exp:"O art. 28, caput, prevê: a IGPM/BM é integrante do Comando do Exército.",src:"Lei nº 14.751/2023, art. 28, caput."},
{n:58,cmd:"Julgue o item a seguir, a respeito do inspetor-geral.",text:"O cargo de inspetor-geral das polícias militares e dos corpos de bombeiros militares será exercido por oficial-general da ativa.",ans:"C",exp:"O art. 28, § 2º, prevê: o cargo de inspetor-geral será exercido por oficial-general da ativa.",src:"Lei nº 14.751/2023, art. 28, § 2º."},
{n:59,cmd:"Acerca da nomeação dos comandantes-gerais, julgue o item subsequente.",text:"Os comandantes-gerais das polícias militares e dos corpos de bombeiros militares serão nomeados por ato do governador entre os oficiais da ativa do último posto do QOEM.",ans:"C",exp:"O art. 29, caput, prevê: os comandantes-gerais serão nomeados por ato do governador entre os oficiais da ativa do último posto do QOEM.",src:"Lei nº 14.751/2023, art. 29, caput."},
{n:60,cmd:"Com relação ao plano de comando, julgue o seguinte item.",text:"O comandante-geral nomeado deverá apresentar, em até 60 (sessenta) dias da posse, plano de comando com metas, indicadores, prestação de contas e participação da sociedade.",ans:"C",exp:"O art. 29, § 2º, prevê: o comandante-geral deverá apresentar, em até 60 dias da posse, plano de comando com metas, indicadores, prestação de contas e participação da sociedade.",src:"Lei nº 14.751/2023, art. 29, § 2º."},
{n:61,cmd:"Julgue o item a seguir, a respeito das competências do comandante-geral.",text:"Compete ao comandante-geral indicar os nomes para nomeação aos cargos que lhe são privativos, realizar a promoção das praças e apresentar ao governador a lista de promoção dos oficiais.",ans:"C",exp:"O art. 29, § 3º, prevê: compete aos comandantes-gerais indicar os nomes para nomeação aos cargos que lhes são privativos, realizar a promoção das praças e apresentar ao governador a lista de promoção dos oficiais.",src:"Lei nº 14.751/2023, art. 29, § 3º."},
{n:62,cmd:"Acerca do relatório anual do comandante-geral, julgue o item subsequente.",text:"O comandante-geral deverá assegurar a divulgação pública de relatório anual sobre representações recebidas e apuradas, letalidade e vitimização de policiais e de civis, e orçamento previsto e executado.",ans:"C",exp:"O art. 29, § 5º, prevê que o comandante-geral deverá assegurar a divulgação pública de relatório anual sobre representações, ocorrências, letalidade e vitimização de policiais e civis, e orçamento previsto e executado.",src:"Lei nº 14.751/2023, art. 29, § 5º."},
{n:63,cmd:"Com relação à atuação ostensiva, julgue o seguinte item.",text:"No cumprimento de sua missão constitucional, as polícias militares e os corpos de bombeiros militares atuarão de forma ostensiva, visivelmente identificados por meio de uniforme, armamento, viatura e equipamentos próprios.",ans:"C",exp:"O art. 33, caput, prevê: atuarão de forma ostensiva, visivelmente identificados por meio de uniforme, armamento, viatura e equipamentos próprios.",src:"Lei nº 14.751/2023, art. 33, caput."},
{n:64,cmd:"Julgue o item a seguir, a respeito da padronização.",text:"O Poder Executivo federal editará decreto com a definição de parâmetros mínimos para insígnias, divisas, coloração das peças de fardamento, carteira de identidade militar e padrão das viaturas.",ans:"C",exp:"O art. 34, caput, prevê que o Poder Executivo federal editará decreto com parâmetros mínimos para insígnias, divisas, coloração, carteira de identidade militar e padrão das viaturas.",src:"Lei nº 14.751/2023, art. 34, caput, I a VI."},
{n:65,cmd:"Acerca das denominações consagradas, julgue o item subsequente.",text:"É assegurada a exclusividade da utilização das denominações 'brigada militar' e 'força pública' para a polícia militar, e 'bombeiros militares' e 'corpo de bombeiros' para o corpo de bombeiros militar.",ans:"C",exp:"O art. 35, caput, prevê: é assegurada a exclusividade da utilização das denominações 'brigada militar' e 'força pública' para a PM e 'bombeiros militares' e 'corpo de bombeiros' para o CBM.",src:"Lei nº 14.751/2023, art. 35, caput."},
{n:66,cmd:"Com relação às datas comemorativas, julgue o seguinte item.",text:"São instituídas as datas comemorativas nacionais de 21 de abril para as polícias militares e de 2 de julho para os corpos de bombeiros militares.",ans:"C",exp:"O art. 35, § 1º, prevê: são instituídas as datas comemorativas nacionais de 21 de abril para as PMs e de 2 de julho para os CBMs.",src:"Lei nº 14.751/2023, art. 35, § 1º."},
{n:67,cmd:"Julgue o item a seguir, a respeito do uso de uniformes.",text:"É vedado, sob pena de responsabilização administrativa e judicial, o uso dos uniformes, símbolos e cores das polícias militares e dos corpos de bombeiros militares por qualquer instituição, pública ou privada, ou por pessoa física.",ans:"C",exp:"O art. 35, § 2º, prevê: é vedado, sob pena de responsabilização administrativa e judicial, o uso dos uniformes, símbolos e cores por qualquer instituição ou pessoa física.",src:"Lei nº 14.751/2023, art. 35, § 2º."},
{n:68,cmd:"Acerca dos conselhos nacionais, julgue o item subsequente.",text:"São instituídos o Conselho Nacional de Comandantes-Gerais de Polícia Militar (CNCGPM) e o Conselho Nacional de Comandantes-Gerais de Bombeiros Militares (CNCGBM), de natureza oficial.",ans:"C",exp:"O art. 37, caput, prevê: são instituídos o CNCGPM e o CNCGBM, de natureza oficial, integrados por todos os comandantes-gerais.",src:"Lei nº 14.751/2023, art. 37, caput."},
{n:69,cmd:"Com relação à participação social, julgue o seguinte item.",text:"As polícias militares e os corpos de bombeiros militares devem promover instâncias de participação social e nomear representantes no Conselho de Segurança Pública e Defesa Social.",ans:"C",exp:"O art. 38, caput, prevê: devem promover instâncias de participação social e nomear representantes no Conselho de Segurança Pública e Defesa Social.",src:"Lei nº 14.751/2023, art. 38, caput."},
{n:70,cmd:"Julgue o item a seguir, a respeito da transição de escolaridade.",text:"A adoção do requisito de escolaridade superior para ingresso na instituição militar será processada no prazo de até 6 (seis) anos a contar da publicação da Lei nº 14.751/2023.",ans:"C",exp:"O art. 39, caput, prevê: a adoção do requisito de escolaridade para ingresso será processada no prazo de até 6 anos a contar da publicação desta Lei.",src:"Lei nº 14.751/2023, art. 39, caput."},
{n:71,cmd:"Acerca da vigência da lei, julgue o item subsequente.",text:"A Lei nº 14.751/2023 entrou em vigor na data de sua publicação.",ans:"C",exp:"O art. 44 prevê: esta Lei entra em vigor na data de sua publicação.",src:"Lei nº 14.751/2023, art. 44."},
{n:72,cmd:"Com relação à revogação, julgue o seguinte item.",text:"A Lei nº 14.751/2023 revoga dispositivos do Decreto-Lei nº 667, de 2 de julho de 1969, incluindo seus arts. 1º e 2º.",ans:"C",exp:"O art. 43, inciso I, prevê: revogam-se os seguintes dispositivos do Decreto-Lei nº 667/1969: I - arts. 1º e 2º.",src:"Lei nº 14.751/2023, art. 43, I."},
{n:73,cmd:"Julgue o item a seguir, a respeito das atribuições das PMs em inteligência.",text:"Compete às polícias militares produzir, difundir, planejar, orientar, coordenar, supervisionar e executar ações de inteligência e contrainteligência destinadas à execução e ao acompanhamento de assuntos de segurança pública.",ans:"C",exp:"O art. 5º, inciso XI, prevê essa competência de produzir, difundir, planejar, orientar, coordenar, supervisionar e executar ações de inteligência e contrainteligência.",src:"Lei nº 14.751/2023, art. 5º, XI."},
{n:74,cmd:"Acerca das correições, julgue o item subsequente.",text:"As polícias militares devem realizar correições, inspeções e auditorias apenas em caráter extraordinário, quando houver denúncia de desvio de conduta.",ans:"E",exp:"O art. 5º, inciso XII, prevê que as PMs devem realizar correições, inspeções e auditorias em caráter PERMANENTE, ordinário OU extraordinário. O termo 'apenas em caráter extraordinário' restringe indevidamente.",src:"Lei nº 14.751/2023, art. 5º, XII."},
{n:75,cmd:"Com relação à polícia comunitária, julgue o seguinte item.",text:"As polícias militares devem realizar ações de polícia comunitária para prevenção de conflitos.",ans:"C",exp:"O art. 5º, inciso XX, prevê: realizar ações de polícia comunitária para prevenção de conflitos.",src:"Lei nº 14.751/2023, art. 5º, XX."},
{n:76,cmd:"Julgue o item a seguir, a respeito das prerrogativas de prisão.",text:"Salvo as prisões disciplinares militares, os militares têm a prerrogativa de serem presos somente por ordem escrita da autoridade judiciária competente ou em flagrante delito.",ans:"C",exp:"O art. 18, parágrafo único, prevê: salvo as prisões disciplinares militares, os militares têm a prerrogativa de serem presos somente por ordem escrita da autoridade judiciária ou em flagrante delito.",src:"Lei nº 14.751/2023, art. 18, parágrafo único."},
{n:77,cmd:"Acerca do curso de comando e estado-maior (CCEM), julgue o item subsequente.",text:"O CCEM é destinado aos majores e tenentes-coronéis do QOEM e do QOS e à promoção ao posto de coronel.",ans:"C",exp:"O art. 16, § 2º, I, alínea 'c', prevê: CCEM destinado aos majores e tenentes-coronéis do QOEM e do QOS e à promoção ao posto de coronel.",src:"Lei nº 14.751/2023, art. 16, § 2º, I, 'c'."},
{n:78,cmd:"Com relação ao Quadro de Oficiais Temporários, julgue o seguinte item.",text:"A Lei nº 14.751/2023 veda a instituição de Quadro de Oficial Temporário (QOT) e Quadro de Praça Temporário (QPT) nas corporações militares.",ans:"E",exp:"O art. 15, § 4º, prevê que a critério das corporações PODERÃO ser instituídos QOT e QPT. A lei faculta, não veda.",src:"Lei nº 14.751/2023, art. 15, § 4º."},
{n:79,cmd:"Julgue o item a seguir, a respeito do tempo mínimo de permanência.",text:"É garantia do militar o tempo mínimo de 1 (um) ano de permanência na unidade militar, ressalvada a transferência a pedido ou compulsória.",ans:"C",exp:"O art. 18, inciso XXIV, prevê: tempo mínimo de 1 ano de permanência na unidade militar, ressalvada a transferência a pedido ou compulsória.",src:"Lei nº 14.751/2023, art. 18, XXIV."},
{n:80,cmd:"Acerca da assistência jurídica, julgue o item subsequente.",text:"O militar tem direito a assistência jurídica perante qualquer juízo ou tribunal quando acusado de prática de infração penal, civil ou administrativa decorrente do exercício da função ou em razão dela.",ans:"C",exp:"O art. 18, inciso XI, prevê: assistência jurídica perante qualquer juízo ou tribunal quando acusado de prática de infração penal, civil ou administrativa decorrente do exercício da função.",src:"Lei nº 14.751/2023, art. 18, XI."},
{n:81,cmd:"Com relação ao seguro de vida, julgue o seguinte item.",text:"É garantia do militar o seguro de vida e de acidentes ou indenização fixada em lei do ente federado, quando vitimado no exercício da função ou em razão dela.",ans:"C",exp:"O art. 18, inciso XII, prevê: seguro de vida e de acidentes ou indenização fixada em lei do ente federado, quando vitimado no exercício da função.",src:"Lei nº 14.751/2023, art. 18, XII."},
{n:82,cmd:"Julgue o item a seguir, a respeito da remuneração.",text:"A remuneração dos militares observará escalonamento vertical entre os postos e as graduações estabelecido na lei do ente federado, podendo a lei estabelecer diferença mínima e máxima entre postos e graduações.",ans:"C",exp:"O art. 18, inciso XIV, prevê: remuneração com escalonamento vertical entre os postos e as graduações, podendo a lei estabelecer diferença mínima e máxima.",src:"Lei nº 14.751/2023, art. 18, XIV."},
{n:83,cmd:"Acerca do regime disciplinar, julgue o item subsequente.",text:"O regime disciplinar do militar é regulado em código de ética, na forma de lei do ente federado, com penas disciplinares, assegurados o devido processo legal, a ampla defesa e o contraditório.",ans:"C",exp:"O art. 18, inciso XXXIII, prevê: regime disciplinar regulado em código de ética, com penas disciplinares, assegurados o devido processo legal, a ampla defesa e o contraditório.",src:"Lei nº 14.751/2023, art. 18, XXXIII."},
{n:84,cmd:"Com relação à reversão ao serviço ativo, julgue o seguinte item.",text:"A reversão ao serviço ativo do militar da reserva remunerada é compulsória, nas hipóteses previstas na lei do ente federado.",ans:"E",exp:"O art. 18, inciso XXXVI, prevê a VOLUNTARIEDADE nas hipóteses de REVERSÃO. Já a CONVOCAÇÃO (inciso XXXVII) é compulsória. A questão confundiu reversão (voluntária) com convocação (compulsória).",src:"Lei nº 14.751/2023, art. 18, XXXVI e XXXVII."},
{n:85,cmd:"Julgue o item a seguir, a respeito das diretrizes.",text:"O livre convencimento técnico-jurídico do oficial no exercício da polícia judiciária militar é uma das diretrizes observadas pelas instituições militares.",ans:"C",exp:"O art. 4º, inciso XVIII, prevê: livre convencimento técnico-jurídico do oficial no exercício da polícia judiciária militar.",src:"Lei nº 14.751/2023, art. 4º, XVIII."},

const answers={};
const container=document.getElementById('quizContainer');

function renderQuiz(){
    container.innerHTML='';
    questions.forEach((q)=>{
        const card=document.createElement('div');
        card.className='question-card';
        card.id='q-'+q.n;
        card.innerHTML='<div class="q-header"><span class="q-num">Item '+q.n+'</span><span class="q-status pending" id="status-'+q.n+'">Pendente</span></div><div class="q-command">'+q.cmd+'</div><div class="q-text">'+q.text+'</div><div class="q-buttons"><button class="btn-answer" id="btnC-'+q.n+'" onclick="answer('+q.n+',\'C\')">✓ Certo</button><button class="btn-answer" id="btnE-'+q.n+'" onclick="answer('+q.n+',\'E\')">✗ Errado</button></div><div class="explanation" id="exp-'+q.n+'"><div class="exp-gabarito '+(q.ans==='C'?'c':'e')+'">⚡ Gabarito: '+(q.ans==='C'?'Certo (C)':'Errado (E)')+'</div><div class="exp-text">📖 '+q.exp+'</div><div class="exp-source">🔍 Fonte: '+q.src+'</div></div>';
        container.appendChild(card);
    });
}

function answer(qNum,choice){
    if(answers[qNum])return;
    const q=questions.find(x=>x.n===qNum);
    answers[qNum]=choice;
    const isCorrect=choice===q.ans;
    const btnC=document.getElementById('btnC-'+qNum);
    const btnE=document.getElementById('btnE-'+qNum);
    const exp=document.getElementById('exp-'+qNum);
    const status=document.getElementById('status-'+qNum);
    const card=document.getElementById('q-'+qNum);
    if(choice==='C'){btnC.className='btn-answer '+(isCorrect?'selected-correct':'selected-wrong');}
    else{btnE.className='btn-answer '+(isCorrect?'selected-correct':'selected-wrong');}
    btnC.classList.add('disabled');btnE.classList.add('disabled');
    btnC.onclick=null;btnE.onclick=null;
    exp.className='explanation show '+(isCorrect?'correct':'wrong');
    status.className='q-status '+(isCorrect?'correct':'wrong');
    status.textContent=isCorrect?'✓ Correto':'✗ Errado';
    card.classList.add('answered');
    updateStats();
}

function updateStats(){
    let certas=0,erradas=0,branco=0;
    questions.forEach(q=>{
        if(!answers[q.n])branco++;
        else if(answers[q.n]===q.ans)certas++;
        else erradas++;
    });
    const restante=100-certas-erradas;
    const pontos=certas-erradas;
    document.getElementById('statCertas').textContent=certas;
    document.getElementById('statErradas').textContent=erradas;
    document.getElementById('statBranco').textContent=branco;
    document.getElementById('statRestante').textContent=restante;
    document.getElementById('statPontos').textContent=pontos;
    document.getElementById('progressFill').style.width=((certas+erradas)/100*100)+'%';
}

function showResults(){
    let certas=0,erradas=0,branco=0;
    questions.forEach(q=>{
        if(!answers[q.n])branco++;
        else if(answers[q.n]===q.ans)certas++;
        else erradas++;
    });
    const pontos=certas-erradas;
    const percent=Math.round((certas/100)*100);
    document.getElementById('finalScore').textContent=pontos+' pontos';
    let msg='';
    if(pontos>=70)msg='🏆 Excelente! Você está muito bem preparado!';
    else if(pontos>=50)msg='👍 Bom desempenho! Continue estudando.';
    else if(pontos>=30)msg='⚠️ Desempenho médio. Revise os artigos da lei.';
    else msg='📚 Precisa estudar mais. Releia a Lei nº 14.751/2023 com atenção.';
    document.getElementById('finalMsg').textContent=msg;
    const table=document.getElementById('resultsTable');
    table.innerHTML='<tr><th>Métrica</th><th>Quantidade</th></tr><tr><td>✓ Certos</td><td>'+certas+'</td></tr><tr><td>✗ Errados</td><td>'+erradas+'</td></tr><tr><td>○ Em Branco</td><td>'+branco+'</td></tr><tr><td>📊 Pontuação (C-E)</td><td>'+pontos+'</td></tr><tr><td>📈 Aproveitamento</td><td>'+percent+'%</td></tr>';
    document.getElementById('results').classList.add('show');
    document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
    Object.keys(answers).forEach(k=>delete answers[k]);
    renderQuiz();
    updateStats();
    document.getElementById('results').classList.remove('show');
    window.scrollTo({top:0,behavior:'smooth'});
}

function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}

renderQuiz();
updateStats();
</script>
